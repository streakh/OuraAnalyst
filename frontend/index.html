<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Analyst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .query-card {
            margin-bottom: 2rem;
        }
        .response-card {
            min-height: 200px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .query-examples {
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .example-chip {
            display: inline-block;
            background-color: #e9ecef;
            border-radius: 16px;
            padding: 0.25rem 0.75rem;
            margin: 0.25rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .example-chip:hover {
            background-color: #dee2e6;
        }
        /* Simplified markdown content styles */
        .markdown-content {
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            max-width: 100%;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
        }
        .markdown-content table {
            border-collapse: collapse;
            margin: 1rem 0;
            width: 100%;
            display: block;
            overflow-x: auto;
        }
        .markdown-content table, .markdown-content th, .markdown-content td {
            border: 1px solid #dee2e6;
            padding: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Oura Analyst</h1>
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card query-card">
                    <div class="card-body">
                        <h5 class="card-title">Ask about your Oura Ring health data</h5>
                        <form id="queryForm">
                            <div class="mb-3">
                                <label for="queryInput" class="form-label">Your Question:</label>
                                <textarea class="form-control" id="queryInput" rows="3" placeholder="e.g., How was my sleep last week? or What's my average HRV?"></textarea>
                                <div class="query-examples">
                                    <p class="text-muted mb-1">Try these examples:</p>
                                    <span class="example-chip" data-query="How was my sleep last week?">How was my sleep last week?</span>
                                    <span class="example-chip" data-query="What's my average HRV over the past month?">What's my average HRV?</span>
                                    <span class="example-chip" data-query="Give me recommendations to improve my sleep.">Sleep recommendations</span>
                                    <span class="example-chip" data-query="What was my readiness score yesterday?">Yesterday's readiness</span>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Get Insights</button>
                        </form>
                    </div>
                </div>
                
                <div class="loading" id="loadingIndicator">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Analyzing your data...</p>
                </div>
                
                <div class="card response-card">
                    <div class="card-body">
                        <h5 class="card-title">Insights</h5>
                        <div id="responseContainer">
                            <p class="text-muted">Your insights will appear here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Add marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Add click handlers for example queries
        document.querySelectorAll('.example-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.getElementById('queryInput').value = this.getAttribute('data-query');
            });
        });

        // Query form submission
        document.getElementById('queryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const query = document.getElementById('queryInput').value.trim();
            
            if (!query) {
                alert('Please enter a question');
                return;
            }
            
            // Show loading indicator
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('responseContainer').innerHTML = '<p class="text-muted">Analyzing your data...</p>';
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Use marked.js to parse markdown
                    const parsedMarkdown = marked.parse(data.response);

                    document.getElementById('responseContainer').innerHTML = `
                      <div class="alert alert-success markdown-content">${parsedMarkdown}</div>

                      <div class="accordion mt-3" id="transparencyAcc">
                        <div class="accordion-item">
                          <h2 class="accordion-header" id="headingMeta">
                            <button class="accordion-button collapsed" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#collapseMeta"
                                    aria-expanded="false" aria-controls="collapseMeta">
                              Data used for this answer
                            </button>
                          </h2>

                          <div id="collapseMeta" class="accordion-collapse collapse"
                               aria-labelledby="headingMeta" data-bs-parent="#transparencyAcc">
                            <div class="accordion-body small">
                              <strong>Date range:</strong> ${data.metadata.dateRange.start}
                              &nbsp;&rarr;&nbsp; ${data.metadata.dateRange.end}<br>
                              <strong>Categories:</strong> ${data.metadata.queryType.join(', ')}
                              <br>
                              <button id="showRawBtn" class="btn btn-outline-secondary btn-sm mt-2">
                                 See full JSON
                              </button>
                              <pre id="rawBlock" class="d-none bg-light p-2 border rounded-2 mt-2"></pre>
                            </div>
                          </div>
                        </div>
                      </div>
                    `;


                    // toggle raw JSON view
                    document.getElementById('showRawBtn').addEventListener('click', () => {
                      const raw = document.getElementById('rawBlock');
                      if (raw.classList.contains('d-none')) {
                        raw.textContent = JSON.stringify(data.metadata.rawData, null, 2);
                        raw.classList.remove('d-none');
                        document.getElementById('showRawBtn').textContent = 'Hide full JSON';
                      } else {
                        raw.classList.add('d-none');
                        document.getElementById('showRawBtn').textContent = 'See full JSON';
                      }
                    });
                } else {
                    document.getElementById('responseContainer').innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error:</strong> ${data.error}<br>
                            ${data.details || ''}<br>
                            ${data.suggestion || ''}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('responseContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> Failed to connect to the server.<br>
                        Please check your connection and try again.
                    </div>
                `;
            } finally {
                // Hide loading indicator
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        });

        // Add listener for Enter key in textarea
        document.getElementById('queryInput').addEventListener('keydown', function(event) {
            // Check if Enter key was pressed WITH the Meta (Cmd) or Ctrl key
            if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
                // Prevent default behavior (potentially submitting the form natively, though less likely in textarea)
                event.preventDefault();
                document.getElementById('queryForm').querySelector('button[type="submit"]').click();
            }
        });
    </script>
</body>
</html>
