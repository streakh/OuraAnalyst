<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Ring Insights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .query-card {
            margin-bottom: 2rem;
        }
        .response-card {
            min-height: 200px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .query-examples {
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .example-chip {
            display: inline-block;
            background-color: #e9ecef;
            border-radius: 16px;
            padding: 0.25rem 0.75rem;
            margin: 0.25rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .example-chip:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Oura Ring Insights</h1>
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card query-card">
                    <div class="card-body">
                        <h5 class="card-title">Ask about your Oura data</h5>
                        <form id="queryForm">
                            <div class="mb-3">
                                <label for="queryInput" class="form-label">Your Question</label>
                                <textarea class="form-control" id="queryInput" rows="3" placeholder="e.g., How was my sleep last week? or What's my average HRV?"></textarea>
                                <div class="query-examples">
                                    <p class="text-muted mb-1">Try these examples:</p>
                                    <span class="example-chip" data-query="How was my sleep last week?">How was my sleep last week?</span>
                                    <span class="example-chip" data-query="What's my average HRV over the past month?">What's my average HRV?</span>
                                    <span class="example-chip" data-query="Give me recommendations to improve my sleep.">Sleep recommendations</span>
                                    <span class="example-chip" data-query="What was my readiness score yesterday?">Yesterday's readiness</span>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Get Insights</button>
                        </form>
                    </div>
                </div>
                
                <div class="loading" id="loadingIndicator">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Analyzing your data...</p>
                </div>
                
                <div class="card response-card">
                    <div class="card-body">
                        <h5 class="card-title">Insights</h5>
                        <div id="responseContainer">
                            <p class="text-muted">Your insights will appear here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Add click handlers for example queries
        document.querySelectorAll('.example-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.getElementById('queryInput').value = this.getAttribute('data-query');
            });
        });

        // Query form submission
        document.getElementById('queryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const query = document.getElementById('queryInput').value.trim();
            
            if (!query) {
                alert('Please enter a question');
                return;
            }
            
            // Show loading indicator
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('responseContainer').innerHTML = '<p class="text-muted">Analyzing your data...</p>';
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Format the response with line breaks
                    const formattedResponse = data.response.replace(/\n/g, '<br>');
                    document.getElementById('responseContainer').innerHTML = `
                        <div class="alert alert-success">
                            ${formattedResponse}
                        </div>
                        <div class="text-muted small mt-2">
                            Query type: ${data.metadata.queryType}<br>
                            Processed at: ${new Date(data.metadata.processedAt).toLocaleString()}
                        </div>
                    `;
                } else {
                    document.getElementById('responseContainer').innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error:</strong> ${data.error}<br>
                            ${data.details || ''}<br>
                            ${data.suggestion || ''}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('responseContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> Failed to connect to the server.<br>
                        Please check your connection and try again.
                    </div>
                `;
            } finally {
                // Hide loading indicator
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        });
    </script>
</body>
</html>
