<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Analyst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .query-card {
            margin-bottom: 2rem;
        }
        .response-card {
            min-height: 200px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .query-examples {
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .example-chip {
            display: inline-block;
            background-color: #e9ecef;
            border-radius: 16px;
            padding: 0.25rem 0.75rem;
            margin: 0.25rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .example-chip:hover {
            background-color: #dee2e6;
        }
        /* Simplified markdown content styles */
        .markdown-content {
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            max-width: 100%;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
        }
        .markdown-content table {
            border-collapse: collapse;
            margin: 1rem 0;
            width: 100%;
            display: block;
            overflow-x: auto;
        }
        .markdown-content table, .markdown-content th, .markdown-content td {
            border: 1px solid #dee2e6;
            padding: 0.5rem;
        }
        /* Remove borders from action buttons */
        .response-actions .btn {
            border: none;
            box-shadow: none !important; /* Remove focus shadow */
        }
        .response-actions .btn:focus {
            box-shadow: none !important;
        }
        /* Increase icon size in action buttons */
        .response-actions .btn i {
            font-size: 1.3rem; /* Adjust size as needed */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Oura Analyst</h1>
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card query-card">
                    <div class="card-body">
                        <h5 class="card-title">Ask about your Oura Ring health data</h5>
                        <form id="queryForm">
                            <div class="mb-3">
                                <label for="queryInput" class="form-label">Your Question:</label>
                                <textarea class="form-control" id="queryInput" rows="3" placeholder="e.g., How was my sleep last week? or What's my average HRV?"></textarea>
                                <div class="query-examples">
                                    <p class="text-muted mb-1">Try these examples:</p>
                                    <span class="example-chip" data-query="How was my sleep last week?">How was my sleep last week?</span>
                                    <span class="example-chip" data-query="What's my average steps over the past month?">What's my average steps?</span>
                                    <span class="example-chip" data-query="Give me recommendations to improve my sleep.">Sleep recommendations</span>
                                    <span class="example-chip" data-query="What was my readiness score yesterday?">Yesterday's readiness</span>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success me-2 px-5">Get Insights</button>
                            <button type="button" id="clearButton" class="btn btn-outline-secondary">Clear</button>
                        </form>
                    </div>
                </div>
                
                <div class="loading" id="loadingIndicator">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Analyzing your data...</p>
                </div>
                
                <div class="card response-card mb-5 d-none" id="responseCard">
                    <div class="card-body">
                        <h5 class="card-title">Insights</h5>
                        <div id="responseContainer">
                            <p class="text-muted">Your insights will appear here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Add marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Add click handlers for example queries
        document.querySelectorAll('.example-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.getElementById('queryInput').value = this.getAttribute('data-query');
            });
        });

        // Query form submission
        document.getElementById('queryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const query = document.getElementById('queryInput').value.trim();
            
            if (!query) {
                alert('Please enter a question');
                return;
            }
            
            // Show loading indicator
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('responseContainer').innerHTML = '<p class="text-muted">Analyzing your data...</p>';
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                const responseCard = document.getElementById('responseCard'); // Get the card element
                
                if (response.ok) {
                    // Show the response card before adding content
                    responseCard.classList.remove('d-none');

                    // Use marked.js to parse markdown
                    const parsedMarkdown = marked.parse(data.response);
                    // Store the successful query for the redo button
                    window.lastSuccessfulQuery = query;

                    document.getElementById('responseContainer').innerHTML = `
                      <div class="alert alert-success markdown-content">${parsedMarkdown}</div>

                      <!-- Action Buttons -->
                      <div class="response-actions mt-3 mb-3">
                          <button class="btn btn-sm btn-outline-secondary me-2" id="redoButton" aria-label="Redo response" data-bs-toggle="tooltip" data-bs-placement="top" title="Redo response"><i class="bi bi-arrow-clockwise"></i></button>
                          <button class="btn btn-sm btn-outline-secondary me-2" id="copyButton" aria-label="Copy response" data-bs-toggle="tooltip" data-bs-placement="top" title="Copy response"><i class="bi bi-clipboard"></i></button>
                          <button class="btn btn-sm btn-outline-secondary" id="savePdfButton" aria-label="Save as PDF" data-bs-toggle="tooltip" data-bs-placement="top" title="Save as PDF"><i class="bi bi-file-earmark-pdf"></i></button>
                      </div>

                      <div class="accordion mt-3" id="transparencyAcc">
                        <div class="accordion-item">
                          <h2 class="accordion-header" id="headingMeta">
                            <button class="accordion-button collapsed" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#collapseMeta"
                                    aria-expanded="false" aria-controls="collapseMeta">
                              Data used for this answer
                            </button>
                          </h2>

                          <div id="collapseMeta" class="accordion-collapse collapse"
                               aria-labelledby="headingMeta" data-bs-parent="#transparencyAcc">
                            <div class="accordion-body small">
                              <strong>Date range:</strong> ${data.metadata.dateRange.start}
                              &nbsp;&rarr;&nbsp; ${data.metadata.dateRange.end}<br>
                              <strong>Categories:</strong> ${data.metadata.queryType.join(', ')}
                              <br>
                              <button id="showRawBtn" class="btn btn-outline-secondary btn-sm mt-2">
                                 See full JSON
                              </button>
                              <pre id="rawBlock" class="d-none bg-light p-2 border rounded-2 mt-2"></pre>
                            </div>
                          </div>
                        </div>
                      </div>
                    `;


                    // toggle raw JSON view
                    document.getElementById('showRawBtn').addEventListener('click', () => {
                      const rawBlock = document.getElementById('rawBlock');
                      const btn = document.getElementById('showRawBtn');

                      if (rawBlock.classList.contains('d-none')) {
                        rawBlock.textContent = JSON.stringify(data.metadata.simplifiedData, null, 2);
                        rawBlock.classList.remove('d-none');
                        btn.textContent = 'Hide full JSON';
                      } else {
                        rawBlock.classList.add('d-none');
                        btn.textContent = 'See full JSON';
                      }
                    });

                    // --- Action Button Handlers ---

                    // Redo Button
                    document.getElementById('redoButton').addEventListener('click', () => {
                        if (window.lastSuccessfulQuery) {
                            document.getElementById('queryInput').value = window.lastSuccessfulQuery;
                            // Trigger form submission
                            document.getElementById('queryForm').querySelector('button[type="submit"]').click();
                        } else {
                            alert('No previous query to redo.');
                        }
                    });

                    // Copy Button
                    document.getElementById('copyButton').addEventListener('click', async () => {
                        const responseContent = document.querySelector('#responseContainer .markdown-content');
                        const copyButton = document.getElementById('copyButton');
                        if (responseContent && responseContent.textContent) {
                            try {
                                await navigator.clipboard.writeText(responseContent.textContent);

                                // Provide feedback - store/restore innerHTML
                                const originalHtml = copyButton.innerHTML;
                                copyButton.innerHTML = 'Copied!';
                                copyButton.disabled = true; // Disable briefly

                                setTimeout(() => {
                                    copyButton.innerHTML = originalHtml; // Restore icon
                                    copyButton.disabled = false;
                                }, 1500);
                            } catch (err) {
                                console.error('Failed to copy text: ', err);
                                alert('Failed to copy text.');
                            }
                        } else {
                            alert('No response content to copy.');
                        }
                    });

                    // Save as PDF Button
                    document.getElementById('savePdfButton').addEventListener('click', () => {
                        const { jsPDF } = window.jspdf; // Get jsPDF constructor
                        const responseContent = document.querySelector('#responseContainer .markdown-content');
                        const saveButton = document.getElementById('savePdfButton');
                        if (!responseContent) {
                            alert('No content to save as PDF.');
                            return;
                        }
                        if (typeof html2canvas === 'undefined' || typeof jsPDF === 'undefined') {
                            alert('PDF generation libraries not loaded correctly.');
                            return;
                        }

                        const originalHtml = saveButton.innerHTML; // Store original HTML (icon)
                        saveButton.innerHTML = 'Generating...'; // Show text
                        saveButton.disabled = true;

                        html2canvas(responseContent, {
                           scale: 2, // Improve resolution
                           useCORS: true // If images are external
                        }).then(canvas => {
                            const imgData = canvas.toDataURL('image/png');
                            const pdf = new jsPDF({
                                orientation: 'portrait',
                                unit: 'pt',
                                format: 'a4'
                            });

                            const pdfWidth = pdf.internal.pageSize.getWidth();
                            const pdfHeight = pdf.internal.pageSize.getHeight();
                            const canvasWidth = canvas.width;
                            const canvasHeight = canvas.height;
                            const ratio = Math.min(pdfWidth / canvasWidth, pdfHeight / canvasHeight);

                            // Calculate the dimensions of the image in the PDF
                            const imgWidth = canvasWidth * ratio * 0.95; // Use 95% width
                            const imgHeight = canvasHeight * ratio * 0.95;

                            // Center the image
                            const xPos = (pdfWidth - imgWidth) / 2;
                            const yPos = 20; // Add some top margin

                            pdf.addImage(imgData, 'PNG', xPos, yPos, imgWidth, imgHeight);
                            pdf.save(`oura_analysis_${new Date().toISOString().slice(0,10)}.pdf`);

                        }).catch(err => {
                            console.error("Error generating PDF:", err);
                            alert('Failed to generate PDF.');
                        }).finally(() => {
                             saveButton.innerHTML = originalHtml; // Restore original HTML (icon)
                             saveButton.disabled = false;
                        });
                    });

                    // Initialize Bootstrap tooltips for action buttons
                    const tooltipTriggerList = [].slice.call(document.querySelectorAll('.response-actions [data-bs-toggle="tooltip"]'));
                    const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                        return new bootstrap.Tooltip(tooltipTriggerEl);
                    });

                } else {
                    // Show the response card even for errors
                    responseCard.classList.remove('d-none');
                    document.getElementById('responseContainer').innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error:</strong> ${data.error}<br>
                            ${data.details || ''}<br>
                            ${data.suggestion || ''}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('responseContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> Failed to connect to the server.<br>
                        Please check your connection and try again.
                    </div>
                `;
            } finally {
                // Hide loading indicator
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        });

        // Add listener for the new Clear button
        document.getElementById('clearButton').addEventListener('click', function() {
            document.getElementById('queryInput').value = '';
            // Hide the response card on clear
            document.getElementById('responseCard').classList.add('d-none');
            // Optionally clear the response container too
            // document.getElementById('responseContainer').innerHTML = '<p class="text-muted">Your insights will appear here...</p>'; 
        });

        // Add listener for Enter key in textarea
        document.getElementById('queryInput').addEventListener('keydown', function(event) {
            // Check if Enter key was pressed WITH the Meta (Cmd) or Ctrl key
            if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
                // Prevent default behavior (potentially submitting the form natively, though less likely in textarea)
                event.preventDefault();
                document.getElementById('queryForm').querySelector('button[type="submit"]').click();
            }
        });
    </script>
</body>
</html>
